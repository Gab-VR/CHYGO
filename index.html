<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A deckbuilder</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <h1 class="brand">A deckbuilder</h1>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="build" aria-selected="true">Build</button>
    <button role="tab" data-tab="hands">Hands</button>
    <button role="tab" data-tab="stats">Stats</button>
    <button role="tab" data-tab="sw">Small World</button>
    <button role="tab" data-tab="format">Format</button>
  </nav>
  <div class="hdr-right">
    <select id="deckSel" aria-label="Deck"></select>
    <select id="fmtSel" aria-label="Format"></select>
    <label class="row" title="Count points against the format's cap"><input type="checkbox" id="ptsToggle"> Points</label>
    <div class="meter" id="meter" hidden><div class="bar"><i></i></div><span></span></div>
    <div class="legal" id="legal"><button class="pill" id="legalPill" aria-describedby="legalPop">…</button><ul class="pop" id="legalPop" role="tooltip"></ul></div>
  </div>
</header>
<main>
  <section class="tab on" id="tab-build"></section>
  <section class="tab" id="tab-hands"></section>
  <section class="tab" id="tab-stats"></section>
  <section class="tab" id="tab-sw"></section>
  <section class="tab" id="tab-format"></section>
</main>
<div class="toast" id="toast"></div>
<dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
<input type="file" id="fileIn" accept=".ydk,.txt" hidden>
<script type="module" src="js/main.js"></script>
<script>
  // Browsers won't run the app's modules from a file:// page. If the app hasn't started, say why.
  addEventListener("load", () => setTimeout(() => {
    if (window.__deckbuilderStarted) return;
    var file = location.protocol === "file:";
    var box = document.createElement("div");
    box.setAttribute("role", "alert");
    box.style.cssText = "margin:40px auto;max-width:620px;padding:16px 20px;background:#283049;border:1px solid #e36a5f;border-radius:10px;color:#ece6d6;font:15px/1.5 system-ui,sans-serif";
    box.innerHTML = file
      ? "<b>Open this app through a local web server.</b><br>Browsers don't run it when it's opened as a file. In a terminal in the app's folder, run <code>python3 -m http.server 8000</code> and open <a style='color:#e6c878' href='http://localhost:8000'>http://localhost:8000</a>."
      : "<b>The app's code didn't load.</b><br>Press F12 and open the Console tab to see why.";
    document.querySelector("main").prepend(box);
  }, 1500));
</script>
</body>
</html>
