<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A deckbuilder</title>
<style>
:root{
  --mat:#1f2538; --panel:#283049; --panel2:#323b57; --line:#414b6b;
  --ink:#ece6d6; --dim:#9ba2b8; --gold:#c9a44c; --gold2:#e6c878;
  --ok:#6cbf8a; --bad:#e36a5f; --warn:#e0a83a;
  --f-normal:#c9a45a; --f-effect:#c46a2e; --f-ritual:#5a7fc2; --f-fusion:#8a5bb0;
  --f-synchro:#d9d9dc; --f-xyz:#34343a; --f-link:#2f64b0; --f-spell:#1e8c7e; --f-trap:#b0467d; --f-token:#8b8b8b;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--mat);color:var(--ink);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}
button.primary{background:var(--gold);color:#241c08;border-color:var(--gold);font-weight:600}
button.ghost{background:transparent}
button.small{padding:1px 7px;font-size:12px}
input,select{background:#1a2032;border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=checkbox]{accent-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:1px}
h1,h2,h3{font-family:var(--serif);font-variant:small-caps;letter-spacing:.02em;font-weight:600;margin:0}
h2{font-size:19px} h3{font-size:16px;color:var(--gold2)}
.dim{color:var(--dim)} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* header */
header{display:flex;align-items:center;gap:16px;padding:8px 16px;background:#181d2d;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{font-size:22px;color:var(--gold2)}
nav{display:flex;gap:2px}
nav button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 10px;font-family:var(--serif);font-variant:small-caps;font-size:16px;color:var(--dim)}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
.hdr-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{padding:3px 10px;border-radius:99px;border:1px solid var(--line);cursor:pointer;background:transparent}
.pill.ok{border-color:var(--ok)} .pill.bad{border-color:var(--bad)}
.meter{display:flex;align-items:center;gap:6px}
.meter .bar{width:90px;height:8px;background:#141927;border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--gold)}
.meter.over .bar i{background:var(--bad)}

main{padding:14px 16px}
.tab:not(.on){display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}

/* build layout */
.build{display:grid;grid-template-columns:320px minmax(0,1fr) 300px;gap:14px;align-items:start}
.search .filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.search .filters .full{grid-column:1/-1}
.results{max-height:calc(100vh - 330px);min-height:200px;overflow:auto;margin-top:6px;border-top:1px solid var(--line)}
.res{display:flex;gap:8px;align-items:center;padding:5px 4px;border-bottom:1px solid #2f3752;cursor:pointer}
.res:hover{background:var(--panel2)}
.res.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--gold)}
.res .sw{width:8px;align-self:stretch;border-radius:2px;flex:none}
.res .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .sub{font-size:12px;color:var(--dim)}
.res .lim{margin-left:auto;font-size:12px;flex:none}
.res img{width:34px;height:34px;object-fit:cover;border-radius:3px;flex:none}

.deckbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.section{margin-bottom:14px;border:1px dashed transparent;border-radius:10px;padding:4px}
.section.drop{border-color:var(--gold)}
.section-h{display:flex;align-items:baseline;gap:10px;margin:0 0 6px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;min-height:46px}
.empty{color:var(--dim);font-size:13px;padding:10px;border:1px dashed var(--line);border-radius:8px;grid-column:1/-1}

/* card tile: frame colour carries the card type */
.tile{position:relative;border-radius:6px;padding:5px 7px 5px 11px;cursor:pointer;min-height:52px;
  background:var(--fc);color:#1b1408;border:1px solid rgba(0,0,0,.35);overflow:hidden}
.tile.dark{color:#f0ece0}
.tile.pend{background:linear-gradient(180deg,var(--fc) 55%,var(--f-spell) 55%)}
.tile.sel{outline:2px solid var(--gold2);outline-offset:1px}
.tile.illegal{box-shadow:inset 0 0 0 2px var(--bad)}
.tile .nm{font-family:var(--serif);font-weight:700;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:18px}
.tile .sub{font-size:11px;opacity:.8;margin-top:2px}
.tile .cnt{position:absolute;top:4px;right:5px;background:rgba(0,0,0,.72);color:#fff;border-radius:4px;font-size:12px;font-weight:700;padding:0 5px}
.tile .tags{position:absolute;left:0;top:0;bottom:0;width:5px;display:flex;flex-direction:column}
.tile .tags i{flex:1}
.tile .pts{position:absolute;bottom:3px;right:5px;font-size:11px;font-weight:700;background:var(--gold);color:#241c08;border-radius:3px;padding:0 4px}
.tile.art{min-height:70px;background-size:cover;background-position:center;color:#fff;text-shadow:0 1px 2px #000}
.tile.art::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,.15) 70%);}
.tile.art>*{position:relative}
.tile.art .tags,.tile.art .cnt,.tile.art .pts{position:absolute}
.tile .cnt,.tile .pts{text-shadow:none}

/* limit / points bubbles */
.bubs{margin-left:auto;display:flex;gap:4px;flex:none;align-items:center}
.bub{font-size:11px;line-height:1.5;border-radius:99px;padding:0 8px;font-weight:700;white-space:nowrap}
.bub.forb{background:var(--bad);color:#fff}
.bub.lim{background:#e08a3a;color:#241406}
.bub.semi{background:#e6cf6a;color:#2a2308}
.bub.pts{background:transparent;color:var(--gold2);border:1px solid var(--gold)}
button.toggle[aria-pressed=true]{background:var(--gold);color:#241c08;border-color:var(--gold);font-weight:600}

/* category boxes (deck) and group headers (search) */
.catbox{border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:8px;padding:6px 6px 8px;margin-bottom:8px}
.catbox-h{display:flex;gap:8px;align-items:baseline;font-size:13px;margin:0 0 6px 2px}
.catbox-h b{color:var(--c);font-family:var(--serif);font-size:14px}
.catbox.drop{outline:2px solid var(--c);outline-offset:1px}
.empty-boxes{display:flex;flex-wrap:wrap;gap:6px}
.catbox.empty-box{flex:1 1 120px;margin:0;padding:8px 10px;border-style:dashed;background:transparent}
.catbox.empty-box .catbox-h{margin:0;justify-content:center}
.catbox.empty-box .catbox-h b{white-space:nowrap}
.catbox.empty-box .catbox-h span{display:none}
button.dir{padding:4px 9px;font-size:13px;line-height:1}
.res-group{position:sticky;top:0;z-index:1;background:var(--panel);padding:8px 4px 3px;font-size:12px;font-weight:700;color:var(--c,var(--dim));border-bottom:1px solid var(--line)}

/* detail panel */
.zoom{position:relative}
.name-row{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.name-row .gp-mark{position:static;flex:none}
.gp-mark{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6e39a,var(--gold) 60%,#8a6a1c);
  color:#241c08;border:2px solid #241c08;box-shadow:0 2px 6px rgba(0,0,0,.5);line-height:1}
.gp-mark b{font-size:18px} .gp-mark small{font-size:9px;font-weight:700}
.xinfo{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.xinfo summary{cursor:pointer;list-style-position:inside}
.xinfo summary h3{display:inline}
.xinfo table{font-size:12px}
.xinfo .kv th{width:42%;color:var(--dim);font-weight:500}
.prints{max-height:220px;overflow:auto}
.prints td.code{white-space:nowrap;font-variant-numeric:tabular-nums}

.detail img{width:100%;border-radius:6px;margin-bottom:8px}
.detail .typeline{color:var(--dim);font-size:13px;margin:2px 0 8px}
.detail .desc{white-space:pre-wrap;font-size:13px;background:#1f263a;border-radius:6px;padding:8px;max-height:260px;overflow:auto}
.detail .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border-radius:99px;padding:1px 9px;font-size:12px;border:1px solid var(--c);background:transparent;color:var(--ink)}
.chip.on{background:var(--c);color:#161616;font-weight:600}
/* legality details: shown on hover/focus of the header pill, or when tapped */
.legal{position:relative}
.legal .pop{display:none;position:absolute;right:0;top:calc(100% + 6px);width:min(360px,90vw);z-index:10;margin:0;
  padding:8px 10px 8px 26px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.legal .pop:empty{display:none!important}
.legal:hover .pop,.legal:focus-within .pop,.legal.open .pop{display:block}
.legal .pop li{margin:2px 0} .legal .pop li.warn{color:var(--warn)}
.imgnote{font-size:12px}
.img-status{gap:6px;min-width:0}
.img-status .imgnote{max-width:52ch}

/* hands */
.hands{display:grid;grid-template-columns:300px minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #353e5c;vertical-align:middle}
th{font-weight:600;color:var(--dim);font-size:12px}
td.num,th.num{text-align:right}
.hands .panel:first-child table{font-size:13px}
.cat-row{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.cat-row input[type=color]{width:28px;height:26px;padding:0;border:0;background:none}
.scen{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.scen .p{font-family:var(--serif);font-size:24px;color:var(--gold2)}
.cond{display:flex;gap:5px;margin:4px 0}
.cond select,.cond input{padding:3px 5px}
.big{font-family:var(--serif);font-size:40px;color:var(--gold2);line-height:1}
.hand-sample{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.bars .b{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;margin:3px 0;font-size:13px}
.bars .b span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .track{height:12px;background:#1a2032;border-radius:3px;overflow:hidden}
.bars .track i{display:block;height:100%}

/* small world */
.sw{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.sw canvas{width:100%;height:560px;display:block;background:#1a2033;border-radius:8px;touch-action:none}
.matrix-wrap{overflow:auto;max-height:600px}
.matrix td,.matrix th{border:1px solid #2a3149;padding:0;text-align:center;font-size:11px;min-width:24px;height:24px}
.matrix th.rh{text-align:right;padding:0 6px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.matrix th.ch{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;white-space:nowrap;padding:4px 0;vertical-align:bottom}
.matrix td{cursor:pointer}
.bridge{padding:6px 0;border-bottom:1px solid #353e5c;font-size:13px}
.bridge b{font-family:var(--serif)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed=true]{background:var(--gold);color:#241c08}

/* format */
.fmt{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.form{display:grid;grid-template-columns:180px 1fr;gap:8px 12px;align-items:center;max-width:620px}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.list-item.on{background:var(--panel2);outline:1px solid var(--gold)}
.sugg{position:relative}
.sugg .menu{position:absolute;z-index:9;left:0;right:0;top:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto}
.sugg .menu div{padding:5px 8px;cursor:pointer}
.sugg .menu div:hover{background:var(--line)}

.splash{max-width:560px;margin:40px auto;text-align:left}
.splash p{max-width:65ch}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:8px 14px;border-radius:8px;z-index:20;display:none}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;max-width:560px;width:92vw}
dialog textarea{width:100%;min-height:160px;background:#1a2032;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px/1.4 ui-monospace,monospace}
dialog::backdrop{background:rgba(0,0,0,.55)}

@media (max-width:1150px){
  .build{grid-template-columns:300px minmax(0,1fr)} .build .detail{grid-column:1/-1}
  .hands{grid-template-columns:1fr 1fr} .hands>:first-child{grid-column:1/-1}
}
@media (max-width:760px){
  .build,.hands,.sw,.fmt{grid-template-columns:1fr}
  .results{max-height:50vh}
  .form{grid-template-columns:1fr}
  .sw canvas{height:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="brand">Deck Forge</h1>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="build" aria-selected="true">Build</button>
    <button role="tab" data-tab="hands">Hands</button>
    <button role="tab" data-tab="stats">Stats</button>
    <button role="tab" data-tab="sw">Small World</button>
    <button role="tab" data-tab="format">Format</button>
  </nav>
  <div class="hdr-right">
    <select id="deckSel" aria-label="Deck"></select>
    <select id="fmtSel" aria-label="Format"></select>
    <label class="row" title="Count points against the format's cap"><input type="checkbox" id="ptsToggle"> Points</label>
    <div class="meter" id="meter" hidden><div class="bar"><i></i></div><span></span></div>
    <div class="legal" id="legal"><button class="pill" id="legalPill" aria-describedby="legalPop">…</button><ul class="pop" id="legalPop" role="tooltip"></ul></div>
  </div>
</header>
<main>
  <section class="tab on" id="tab-build"></section>
  <section class="tab" id="tab-hands"></section>
  <section class="tab" id="tab-stats"></section>
  <section class="tab" id="tab-sw"></section>
  <section class="tab" id="tab-format"></section>
</main>
<div class="toast" id="toast"></div>
<dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
<input type="file" id="fileIn" accept=".ydk,.txt" hidden>
<script>
"use strict";
/* ================= utilities ================= */
/* Card data is served from this site's own data/ folder (built by scripts/update-cards.mjs).
   The app never contacts YGOPRODeck or any other third party. */
const DATA = "data/";
/* Images: "off" | "folder" (a folder the user picks; files stay on their machine)
   | "path" (a URL template such as pics/{id}.jpg, for a self-hosted or local copy) */
const IMGS = { urls: new Map(), handle: null, needsPermission: false, pathHits: 0, pathMisses: 0 };
// In path mode, try a few of the deck's images so we can say clearly when the path finds nothing.
// Test-load a handful of images (deck cards first) so a mode that "works" but shows nothing is reported.
function probePath() {
  IMGS.pathHits = IMGS.pathMisses = 0; IMGS.probeErr = null;
  if (S.ui.img === "off" || (S.ui.img === "folder" && !IMGS.urls.size)) return;
  const d = deck();
  let ids = [...new Set([...Object.keys(d.main), ...Object.keys(d.extra), ...Object.keys(d.side)])].map(Number);
  if (S.ui.img === "folder") {   // deck cards that have images, plus a random sample across the folder
    const keys = [...IMGS.urls.keys()];
    ids = ids.filter(id => IMGS.urls.has(id)).slice(0, 6);
    for (let i = 0; i < 6 && keys.length; i++) ids.push(keys[Math.floor(Math.random() * keys.length)]);
  }
  ids = [...new Set(ids)].slice(0, 12);
  if (!ids.length) return;
  let left = ids.length;
  const done = ok => { ok ? IMGS.pathHits++ : IMGS.pathMisses++; if (--left === 0) { renderHeader(); if (S.tab === "build") renderBuild(); if (S.tab === "format") renderFormat(); } };
  for (const id of ids) { const im = new Image(); im.onload = () => done(true); im.onerror = () => done(false); im.src = IMG_FULL(id); }
}
const imgOn = () => S.ui.img === "path" || (S.ui.img === "folder" && IMGS.urls.size > 0);
const IMG_FULL = id => S.ui.img === "path" ? S.ui.imgTpl.replace("{id}", id) : IMGS.urls.get(+id) || "";
const IMG_ART = id => S.ui.img === "path" && S.ui.artTpl ? S.ui.artTpl.replace("{id}", id) : IMG_FULL(id);
// a full card image has its art box in the upper middle; a cropped-art template is used as is
const artPos = () => S.ui.img === "path" && S.ui.artTpl ? {} : { backgroundSize: "150%", backgroundPosition: "50% 28%" };
const hideBroken = e => { e.target.style.visibility = "hidden"; };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") { for (const [p, x] of Object.entries(v)) p.startsWith("--") ? e.style.setProperty(p, x) : e.style[p] = x; }
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("aria-")) e.setAttribute(k, String(v));
    else if (k in e && typeof v !== "string") e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
}
// let replaceChildren skip null/false like h() does
{ const rc = Element.prototype.replaceChildren; Element.prototype.replaceChildren = function (...k) { rc.apply(this, k.flat(Infinity).filter(x => x != null && x !== false)); }; }
const uid = () => Math.random().toString(36).slice(2, 10);
const pct = p => p <= 0 ? "0%" : p >= 1 ? "100%" : (100 * p).toFixed(p > 0.999 || p < 0.001 ? 2 : 1) + "%";
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2600); }
const binomMemo = new Map();
function binom(n, k) {
  if (k < 0 || k > n) return 0; k = Math.min(k, n - k);
  const key = n * 1000 + k; if (binomMemo.has(key)) return binomMemo.get(key);
  let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i;
  binomMemo.set(key, r); return r;
}

/* ================= storage ================= */
const idb = {
  db: null, mem: new Map(),
  open() { return new Promise(res => {
    try { const r = indexedDB.open("deck-forge", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => res();
    } catch { res(); } }); },
  get(k) { if (!this.db) return Promise.resolve(this.mem.get(k)); return new Promise(res => {
    const r = this.db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); },
  set(k, v) { if (!this.db) { this.mem.set(k, v); return Promise.resolve(); } return new Promise(res => {
    const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = res; }); }
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem("deck-forge:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("deck-forge:" + k, JSON.stringify(v)); } catch {} }
};

/* ================= card model ================= */
const isMonster = c => c.type.includes("Monster");
const isSpell = c => c.type === "Spell Card";
const isTrap = c => c.type === "Trap Card";
const isExtra = c => /fusion|synchro|xyz|link/.test(c.frame);
const isPend = c => c.frame.includes("pendulum");
const isLink = c => c.frame.startsWith("link");
const baseFrame = c => c.frame.replace("_pendulum", "");

/* ================= legality ================= */
function limitOf(c, f = fmt()) {
  if (f.over[c.id] != null) return f.over[c.id];
  if (f.noLinkPend && (isLink(c) || isPend(c))) return 0;
  let l = f.copies;
  if (f.banlist !== "none") {
    const b = c.ban[f.banlist];
    if (b === "Banned" || b === "Forbidden") l = 0;
    else if (b === "Limited") l = Math.min(l, 1);
    else if (b === "Semi-Limited") l = Math.min(l, 2);
  }
  return l;
}
function inPool(c, f = fmt()) {
  if (f.pool === "any" || !c.formats.length) return true;
  return c.formats.includes(f.pool.toLowerCase());
}
function pointsOf(c, f = fmt()) {
  if (f.pover[c.id] != null) return f.pover[c.id];
  return (S[f.pointsList] || {})[c.id] || 0;
}
const count = sec => Object.values(sec).reduce((a, b) => a + b, 0);
function totalCopies(d, id) { return (d.main[id] || 0) + (d.extra[id] || 0) + (d.side[id] || 0); }
function deckPoints(d = deck(), f = fmt()) {
  let p = 0; for (const s of ["main", "extra", "side"]) for (const [id, n] of Object.entries(d[s])) { const c = card(id); if (c) p += n * pointsOf(c, f); }
  return p;
}
function validate(d = deck(), f = fmt()) {
  const out = [], m = count(d.main), e = count(d.extra), s = count(d.side);
  if (m < f.min) out.push({ lvl: "err", msg: `Main Deck has ${m} cards; the minimum is ${f.min}.` });
  if (m > f.max) out.push({ lvl: "err", msg: `Main Deck has ${m} cards; the maximum is ${f.max}.` });
  if (e > f.extraMax) out.push({ lvl: "err", msg: `Extra Deck has ${e} cards; the maximum is ${f.extraMax}.` });
  if (s > f.sideMax) out.push({ lvl: "err", msg: `Side Deck has ${s} cards; the maximum is ${f.sideMax}.` });
  const ids = new Set([...Object.keys(d.main), ...Object.keys(d.extra), ...Object.keys(d.side)]);
  for (const id of ids) {
    const c = card(id); if (!c) { out.push({ lvl: "warn", msg: `Unknown card id ${id}.` }); continue; }
    const n = totalCopies(d, id), l = limitOf(c, f);
    if (n > l) out.push({ lvl: "err", id: c.id, msg: l === 0 ? `${c.name} is not allowed.` : `${c.name}: ${n} copies, limit ${l}.` });
    if (!inPool(c, f)) out.push({ lvl: "warn", id: c.id, msg: `${c.name} is not in the ${f.pool} card pool.` });
  }
  if (f.points) { const p = deckPoints(d, f); if (p > f.cap) out.push({ lvl: "err", msg: `${p} points; the cap is ${f.cap}.` }); }
  return out;
}

/* ================= deck editing ================= */
// Human-readable limit status, or null when the card is at the format's normal copy count.
function limitLabel(c, f = fmt()) {
  const l = limitOf(c, f);
  if (l >= f.copies) return null;
  if (f.over[c.id] == null && f.noLinkPend && (isLink(c) || isPend(c))) return { text: "Not allowed", cls: "forb", l };
  if (l === 0) return { text: "Forbidden", cls: "forb", l };
  if (l === 1) return { text: "Limited", cls: "lim", l };
  if (l === 2) return { text: "Semi-Limited", cls: "semi", l };
  return { text: `Max ${l}`, cls: "semi", l };
}
const SECTIONS = ["main", "extra", "side"];
// Custom order: one list of passcodes per section; cards missing from it go at the end in card-type order.
function ensureOrder(d = deck()) {
  d.order ||= {};
  for (const s of SECTIONS) {
    const ids = Object.keys(d[s]).map(Number), have = new Set(ids);
    const kept = (d.order[s] || []).filter(id => have.has(id)), inList = new Set(kept);
    const rest = ids.filter(id => !inList.has(id)).map(card).filter(Boolean).sort((a, b) => sortKey(a).localeCompare(sortKey(b))).map(c => c.id);
    d.order[s] = kept.concat(rest);
  }
  return d.order;
}
function placeInOrder(d, sec, id, before) {
  const o = ensureOrder(d)[sec].filter(x => x !== id);
  const i = before != null ? o.indexOf(+before) : -1;
  i >= 0 ? o.splice(i, 0, id) : o.push(id);
  d.order[sec] = o;
}
function add(id, sec, n = 1, opt = {}) {
  const d = deck(), c = card(id); if (!c) return false;
  id = c.id;
  if (!sec) sec = isExtra(c) ? "extra" : "main";
  if (sec === "main" && isExtra(c)) sec = "extra";
  if (sec === "extra" && !isExtra(c)) sec = "main";
  if (n > 0 && !S.ui.overrideLimit) {
    const l = limitOf(c), have = totalCopies(d, id);
    if (have + n > l) {
      const lab = limitLabel(c);
      toast(l === 0 ? `${c.name} is ${lab ? lab.text : "not allowed"} in ${fmt().name}.`
        : `${c.name} is ${lab ? lab.text : `limited to ${l}`} (${l} cop${l === 1 ? "y" : "ies"}). Turn on "Override card limit" to add more.`);
      S.sel = id; renderDetail(); return false;
    }
  }
  const isNew = !d[sec][id];
  d[sec][id] = (d[sec][id] || 0) + n;
  if (d[sec][id] <= 0) { delete d[sec][id]; ensureOrder(d); }
  else if (isNew || opt.before != null) placeInOrder(d, sec, id, opt.before);

}

  const d = deck(); if (!d[from][id]) return;
  add(id, from, -1, { quiet: true });

  changed();

function reorder(sec, id, before) { if (+id === +before) return; placeInOrder(deck(), sec, +id, before); changed(); }

/* ================= card database ================= */
async function loadDB() {
  const blob = await idb.get("db");
  if (!blob) return false;
  ingest(blob); return true;
}
function ingest(blob) {
  S.cards.clear(); S.alias.clear();
  for (const c of blob.cards) { S.cards.set(c.id, c); for (const a of c.alts || []) if (a !== c.id) S.alias.set(a, c.id); }
  S.list = blob.cards.filter(c => c.frame !== "skill" && c.frame !== "token").sort((a, b) => a.name.localeCompare(b.name));
  S.races = [...new Set(S.list.filter(isMonster).map(c => c.race))].sort();
  S.gp = blob.gp || {}; S.gpo = blob.gpo || {};
  S.setNames = blob.setNames || null; S.rarities = blob.rarities || [];
  S.meta = { version: blob.version, fetched: blob.fetched, source: blob.source, n: blob.cards.length, schema: blob.schema || 1 };
}
async function storeDB(blob) {
  if (!blob || !Array.isArray(blob.cards) || !blob.version) throw new Error("that file isn't a Deck Forge cards.json");
  for (const c of blob.cards) c.formats = (c.formats || []).map(s => s.toLowerCase());
  await idb.set("db", blob); ingest(blob);
}
// Checks data/meta.json (tiny) and downloads data/cards.json only when the version changed.
async function syncData(status = () => {}, force = false) {
  let meta;
  try {
    const r = await fetch(DATA + "meta.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(`meta.json: HTTP ${r.status}`);
    meta = await r.json();
  } catch (e) { return { ok: !!S.meta, reachable: false, err: e.message }; }
  if (!force && S.meta && S.meta.version === meta.version && (S.meta.schema || 1) >= (meta.schema || 1)) return { ok: true, reachable: true, updated: false };
  status("Downloading card data…");
  const r = await fetch(DATA + "cards.json", { cache: "no-cache" });
  if (!r.ok) throw new Error(`cards.json: HTTP ${r.status}`);
  status("Saving to this browser…");
  await storeDB(await r.json());
  return { ok: true, reachable: true, updated: true };
}
async function loadDataFile(file) { await storeDB(JSON.parse(await file.text())); }

/* ================= image folder ================= */
/* Folder images. IMGS.diag records what happened so failures are explained, not silent. */
const IMG_NAME = /^(\d+)\.(jpe?g|png|webp)$/i;
function newDiag() { return { scanned: 0, matched: 0, others: [], unreadable: 0, error: null }; }
function indexFiles(files, diag = newDiag()) {
  for (const u of new Set(IMGS.urls.values())) URL.revokeObjectURL(u);
  IMGS.urls.clear(); IMGS.pathHits = IMGS.pathMisses = 0;   // old probe results no longer apply
  for (const f of files) {
    diag.scanned++;
    const m = IMG_NAME.exec(f.name);
    if (!m) { if (diag.others.length < 3) diag.others.push(f.name); continue; }
    diag.matched++;
    if (!IMGS.urls.has(+m[1])) IMGS.urls.set(+m[1], URL.createObjectURL(f));
  }
  linkAltArts();
  IMGS.diag = diag;
}
// A card whose image only exists under an alternate-art passcode uses that image.
function linkAltArts() {
  for (const [alt, main] of S.alias) if (!IMGS.urls.has(main) && IMGS.urls.has(alt)) IMGS.urls.set(main, IMGS.urls.get(alt));
}
// How many known cards (overall and in the current deck) have an image in the chosen folder.
function coverage() {
  let have = 0, unknown = 0;
  for (const c of S.list) if (IMGS.urls.has(c.id)) have++;
  for (const id of IMGS.urls.keys()) if (!S.cards.has(id) && !S.alias.has(id)) unknown++;
  const d = deck(), ids = [...new Set([...Object.keys(d.main), ...Object.keys(d.extra), ...Object.keys(d.side)])].map(Number);
  const missing = ids.filter(id => !IMGS.urls.has(id)).map(card).filter(Boolean);
  return { have, total: S.list.length, unknown, deckTotal: ids.length, missing };
}
function coverageText() {
  if (!IMGS.urls.size || !S.list.length) return "";
  const cv = coverage(), pc = Math.round(100 * cv.have / Math.max(1, cv.total));
  let s = `The folder has images for ${cv.have.toLocaleString()} of ${cv.total.toLocaleString()} cards (${pc}%).`;
  if (cv.deckTotal) s += cv.missing.length ? ` ${cv.missing.length} of the ${cv.deckTotal} cards in this deck have no image there.` : " Every card in this deck has one.";
  if (cv.unknown) s += ` ${cv.unknown} files have passcodes that aren't in the card data.`;
  return s;
}
async function* walkDir(dir, depth = 0) {
  const subdirs = [];
  for await (const e of dir.values()) { if (e.kind === "file") yield e; else if (depth < 2) subdirs.push(e); }
  for (const d of subdirs) yield* walkDir(d, depth + 1);   // top-level files win over subfolders like pics/field
}
async function indexHandle(dir) {
  const files = [], diag = newDiag();
  IMGS.folderName = dir.name; IMGS.reading = "listing files"; refreshImageStatus();
  const handles = [];
  for await (const fh of walkDir(dir)) {
    if (IMG_NAME.test(fh.name)) handles.push(fh);
    else { diag.scanned++; if (diag.others.length < 3) diag.others.push(fh.name); }
  }
  for (let i = 0; i < handles.length; i += 250) {          // open files in parallel batches, not one by one
    const got = await Promise.allSettled(handles.slice(i, i + 250).map(fh => fh.getFile()));
    for (const r of got) { if (r.status === "fulfilled") files.push(r.value); else { diag.unreadable++; diag.error ||= `${r.reason.name}: ${r.reason.message}`; } }
    IMGS.reading = `${Math.min(i + 250, handles.length).toLocaleString()}/${handles.length.toLocaleString()}`; refreshImageStatus();
  }
  // Cloud-only files list fine but fail when read, so test one.
  if (files.length) {
    try { await files[0].slice(0, 16).arrayBuffer(); }
    catch (e) { diag.error = `${e.name}: ${e.message}`; diag.unreadable = files.length; files.length = 0; }
  }

function folderReport() {
  const d = IMGS.diag; if (!d) return "";

  if (IMGS.urls.size && IMGS.pathMisses) return `${coverageText()} ${IMGS.pathMisses} of ${IMGS.pathMisses + IMGS.pathHits} tested images couldn't be displayed.`;
  if (IMGS.urls.size) return coverageText();
  if (d.unreadable) return `Found ${d.unreadable} images but couldn't read them (${d.error}). Choose the folder again.`;
  if (d.gone) return "The image folder you chose before was moved or deleted. Choose it again from its new location.";
  if (d.aborted) return d.via ? "No folder was selected." : "Edge closed the folder dialog without giving the app a folder. Press the button to try again.";
  if (d.error) return `Couldn't read the folder: ${d.error}.`;
  if (!d.scanned) return "That folder is empty. Pick the folder that directly contains the image files.";

// Second route: the standard folder field ("set" a folder). Works in any browser, and nothing is

function pickWithInput() {

    const inp = h("input", { type: "file", webkitdirectory: true, multiple: true, style: { display: "none" } });
    document.body.append(inp);
    const done = v => { inp.remove(); res(v); };
    inp.addEventListener("change", () => {
      const files = [...inp.files];
      IMGS.handle = null; IMGS.needsPermission = false;
      IMGS.folderName = files[0] && files[0].webkitRelativePath ? files[0].webkitRelativePath.split("/")[0] : "your folder";
      indexFiles(files); IMGS.session = true; done(true);
    });
    inp.addEventListener("cancel", () => { IMGS.diag = Object.assign(newDiag(), { aborted: true, error: "cancelled", via: "file picker" }); done(true); });

async function pickFolder() {

  IMGS.restore = `permission ${perm}`;

  try { await indexHandle(d); } catch (e) { IMGS.reading = null; IMGS.restore = `read failed: ${e.name}: ${e.message}`; return isGone(e) ? forgetFolder("moved or deleted") : (IMGS.needsPermission = true); }

    if (Q.kind === "monster" && !(isMonster(c) && !isExtra(c))) continue;
    if (Q.kind === "extra" && !isExtra(c)) continue;
    if (Q.kind === "spell" && !isSpell(c)) continue;
    if (Q.kind === "trap" && !isTrap(c)) continue;
    if (Q.attr && c.attr !== Q.attr) continue;
    if (Q.race && c.race !== Q.race) continue;
    if (Q.lvMin !== "" && !(c.level >= +Q.lvMin)) continue;
    if (Q.lvMax !== "" && !(c.level <= +Q.lvMax)) continue;
    if (Q.atk !== "" && c.atk !== +Q.atk) continue;
    if (Q.def !== "" && c.def !== +Q.def) continue;
    if (arch && !(c.arch || "").toLowerCase().includes(arch)) continue;
    if (words.length) {
      const hay = S.ui.textSearch ? (c.name + " " + c.desc).toLowerCase() : c.name.toLowerCase();
      if (!words.every(w => hay.includes(w))) continue;

function backupAll() {

// Adds the backup's decks and formats; anything with the same id as an existing one gets a fresh id.
function restoreAll(b) {
  if (!b || b.app !== "deck-forge" || !Array.isArray(b.decks)) throw new Error("missing deck list");
  const deckIds = new Set(S.decks.map(d => d.id)), fmtIds = new Set(S.formats.map(f => f.id));
  const lonelyStarter = S.decks.length === 1 && !count(S.decks[0].main) && !count(S.decks[0].extra) && !count(S.decks[0].side);
  if (lonelyStarter) { S.decks = []; deckIds.clear(); }        // replace the empty default deck
  for (const d of b.decks) { if (deckIds.has(d.id)) d.id = uid(); d.order ||= {}; d.swPool ||= []; d.tags ||= {}; S.decks.push(d); }
  for (const f of b.formats || []) {
    if (S.formats.some(x => x.name === f.name && JSON.stringify({ ...x, id: 0 }) === JSON.stringify({ ...f, id: 0 }))) continue;   // identical format already here
    if (fmtIds.has(f.id)) f.id = uid(); f.over ||= {}; f.pover ||= {}; S.formats.push(f);
  }
  if (b.ui) for (const k of ["deckSort", "searchSort", "searchDir", "textSearch"]) if (b.ui[k] != null) S.ui[k] = b.ui[k];
  S.deckId = S.decks[S.decks.length - 1].id;
  return { decks: b.decks.length, formats: (b.formats || []).length };
}
function uniqueName(base) { let n = base, i = 2; while (S.formats.some(f => f.name === n)) n = `${base} ${i++}`; return n; }

/* ================= init ================= */
async function init() {
  S.decks = LS.get("decks", []); S.formats = LS.get("formats", []);
  if (!S.decks.length) S.decks.push(newDeck("My deck"));
  if (!S.formats.length) S.formats.push(newFormat("TCG"), newFormat("Genesys"), newFormat("Unlimited"));
  for (const d of S.decks) {
    d.swPool ||= []; d.tags ||= {}; d.cats ||= []; d.scen ||= []; d.hand ||= 5; d.order ||= {};
    if (!d.catsV) {                      // older decks: the five default categories become the built-ins
      const names = new Set(DEFAULT_CATS.map(([n]) => n));
      for (const k of d.cats) if (names.has(k.name)) k.builtin = true;
      d.catsV = 2;
    }
  }
  for (const f of S.formats) { f.over ||= {}; f.pover ||= {}; }
  if (!SEARCH_SORTS[S.ui.searchSort]) S.ui.searchSort = "alpha";
  if (S.ui.img === "local") S.ui.img = "path"; else if (!["off", "folder", "path"].includes(S.ui.img)) S.ui.img = "off";
  const cur = LS.get("cur", {});
  S.deckId = S.decks.some(d => d.id === cur.deck) ? cur.deck : S.decks[0].id;
  S.fmtId = S.formats.some(f => f.id === cur.fmt) ? cur.fmt : S.formats[0].id;
  $("#tabs").addEventListener("click", e => { const t = e.target.closest("button"); if (t) setTab(t.dataset.tab); });
  $("#deckSel").onchange = e => { S.deckId = e.target.value; S.sel = null; lastSample = null; changed(); };
  $("#fmtSel").onchange = e => { S.fmtId = e.target.value; changed(); renderResults(); };
  $("#ptsToggle").onchange = e => { fmt().points = e.target.checked; changed(); renderResults(); };
  $("#legalPill").onclick = e => { e.stopPropagation(); $("#legal").classList.toggle("open"); };   // tap support for touch screens
  document.addEventListener("click", () => $("#legal").classList.remove("open"));
  $("#fileIn").onchange = async e => { const file = e.target.files[0]; if (!file) return;
    const { d, unknown } = parseYdk(await file.text()); importDeck(d, unknown, file.name.replace(/\.ydk$/i, "")); e.target.value = ""; };
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", async e => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f && /\.ydk$/i.test(f.name)) { e.preventDefault(); const { d, unknown } = parseYdk(await f.text()); importDeck(d, unknown, f.name.replace(/\.ydk$/i, "")); } });
  await idb.open();

    .catch(e => console.warn("Image folder:", e));

  syncData().then(r => { if (r.updated) { toast(`Card data updated (${S.meta.n} cards)`); changed(); } }).catch(e => console.warn(e));
